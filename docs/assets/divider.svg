<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a7770" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7a7770" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7a7770" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6dff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#9b6dff"/>
      <stop offset=".65" stop-color="#e0457b"/>
      <stop offset="1" stop-color="#f0b35a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6dff"/>
      <stop offset=".55" stop-color="#e0457b"/>
      <stop offset="1" stop-color="#f0b35a"/>
    </linearGradient>
  </defs>
  <style>
    .sweep { animation: sweep 6s cubic-bezier(.45, 0, .55, 1) infinite; }
    @keyframes sweep { from { transform: translateX(-360px); } to { transform: translateX(1200px); } }
    .gem { transform-box: fill-box; transform-origin: center; animation: spin 6s ease-in-out infinite; }
    /* Full turn: the gradient rotates with the shape, so a half turn would flip colors at the loop seam */
    @keyframes spin { 0%, 70% { transform: rotate(45deg); } 100% { transform: rotate(405deg); } }
    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; transform: translateX(420px); }
      .gem { animation: none; transform: rotate(45deg); }
    }
  </style>
  <rect y="11.25" width="1200" height="1.5" fill="url(#rail)"/>
  <rect class="sweep" y="10.5" width="360" height="3" rx="1.5" fill="url(#sweep)"/>
  <rect class="gem" x="594" y="6" width="12" height="12" rx="2.5" fill="url(#accent)"/>
</svg>
